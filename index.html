<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 09</title>
<style>
  body {
    font-family: "Times New Roman", serif;
    margin: 30px;
  }
  .box {
    font-size: 40px;
    font-weight: bold;
    color: #111;
    margin-bottom: 30px;
    padding: 8px 12px;
  }

  /* 1: red double border + light blue gradient */
  .box1 {
    border: 8px double #e8553e;
    background: linear-gradient(to right, #bfe6f2, #c9c6f2);
  }

  /* 2: yellow background + thin blue border + rounded corners */
  .box2 {
    background: #ffe81a;
    border: 3px solid #2a8fd6;
    border-radius: 14px;
  }

  /* 3: green background + gray dotted border */
  .box3 {
    background: #5cc46a;
    border: 10px dotted #888;
  }
</style>
</head>
<body>
  <div class="box box1">Hello World</div>
  <div class="box box2">Hello World</div>
  <div class="box box3">Hello World</div>
</body>
</html>
