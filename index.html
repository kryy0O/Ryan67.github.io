<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 16px;
            text-align: center;
        }

        /* ===== Exercise 09 ===== */
        .ex09 {
            font-family: "Times New Roman", serif;
            margin-top: 30px;
        }
        .box {
            font-size: 40px;
            font-weight: bold;
            color: #111;
            margin-bottom: 30px;
            padding: 8px 12px;
        }
        .box1 {
            border: 8px double #e8553e;
            background: linear-gradient(to right, #bfe6f2, #c9c6f2);
        }
        .box2 {
            background: #ffe81a;
            border: 3px solid #2a8fd6;
            border-radius: 14px;
        }
        .box3 {
            background: #5cc46a;
            border: 10px dotted #888;
        }

        /* ===== Exercise 11 ===== */
        .ex11 {
            font-family: "Times New Roman", Times, serif;
            margin-top: 30px;
        }
        .ex11 h1 {
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
            text-decoration: overline;
            text-decoration-thickness: 5px;
            text-shadow: 3px 3px 3px pink;
        }
        .ex11 h2 {
            font-size: 1.5em;
            font-weight: bold;
            font-style: italic;
            margin: 20px 0;
            border: 2px solid black;
            outline: 3px solid yellow;
            text-shadow: 1px 1px 1px gray;
        }
        .ex11 h3 {
            font-size: 1.17em;
            font-weight: bold;
            margin: 20px 0;
            text-align: right;
            text-decoration: underline;
        }

        /* ===== Exercise 13 ===== */
        .ex13 {
            font-family: "Times New Roman", Times, serif;
            margin-top: 30px;
        }
        .square {
            width: 100px;
            height: 100px;
            background: pink;
            margin-bottom: 30px;
            padding: 4px;
            transition: width 2s, height 2s;
        }
        .sq1:hover {
            width: 600px;
        }
        .sq2:hover {
            width: 140px;
            height: 140px;
        }
    </style>
</head>
<body class="bg-white min-h-screen p-6">

    <!-- Student information -->
    <div class="inline-block">
        <table>
            <thead>
                <tr>
                    <th class="font-bold">Name</th>
                    <th class="font-bold">Student ID</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>張守忠</td>
                    <td>1133584</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Exercise 09 -->
    <div class="ex09">
        <div class="box box1">Hello World</div>
        <div class="box box2">Hello World</div>
        <div class="box box3">Hello World</div>
    </div>

    <!-- Exercise 11 -->
    <div class="ex11">
        <h1>This is heading 1</h1>
        <h2>This is heading 2</h2>
        <h3>This is heading 3</h3>
    </div>

    <!-- Exercise 13 -->
    <div class="ex13">
        <div class="square sq1">1</div>
        <div class="square sq2">2</div>
    </div>

</body>
</html>
